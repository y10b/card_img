name: Render card news
on:
  push:
    paths:
      - 'posts/**/slides.html'
      - 'render.py'
      - '.github/workflows/render.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fonts (Pretendard, Nanum Pen Script)
        run: |
          mkdir -p fonts && cd fonts
          npm pack pretendard@1.3.9 @fontsource/nanum-pen-script@5.3.0
          tar xzf pretendard-1.3.9.tgz --one-top-level=pretendard-1.3.9
          tar xzf fontsource-nanum-pen-script-5.3.0.tgz --one-top-level=fontsource-nanum-pen-script-5.3.0
          rm -f *.tgz
      - name: Install Playwright
        run: |
          pip install playwright==1.47.0
          python -m playwright install --with-deps chromium
      - name: Render
        run: python render.py
      - name: Commit images
        run: |
          rm -rf fonts
          git config user.name "card-render-bot"
          git config user.email "actions@users.noreply.github.com"
          git add posts/*/card_*.jpg
          git diff --cached --quiet || git commit -m "Render card images"
          git push
